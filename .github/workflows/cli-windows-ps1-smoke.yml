name: CLI PowerShell Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cli/**"
      - ".github/workflows/cli-windows-ps1-smoke.yml"
  push:
    branches:
      - "main"
      - "dev"
    paths:
      - "cli/**"
      - ".github/workflows/cli-windows-ps1-smoke.yml"

permissions:
  contents: read

jobs:
  powershell-smoke:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install -r cli/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Python dependency installation failed" }
          # config.sh uses a venv even when invoked through config.ps1.
          python -m venv --system-site-packages cli/venv
          if ($LASTEXITCODE -ne 0) { throw "Config wrapper venv creation failed" }
          New-Item -ItemType File -Path cli/venv/.deps_installed | Out-Null

      - name: Select Git Bash for config wrapper
        run: |
          # config.ps1 delegates registry tasks to Bash. Avoid the WSL launcher.
          $gitBash = Join-Path $env:ProgramFiles "Git\bin"
          if (-not (Test-Path (Join-Path $gitBash "bash.exe"))) {
            throw "Git Bash is required for config.ps1 tests"
          }
          $gitBash >> $env:GITHUB_PATH

      - name: Compile Python
        run: |
          python -m compileall -q cli/mmwk cli/tests
          if ($LASTEXITCODE -ne 0) { throw "Python compilation failed" }

      - name: Check PowerShell wrappers
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem cli/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              throw "$($_.Name): $($parseErrors -join '; ')"
            }
          }

      - name: Test CLI wrappers and local services
        run: |
          python -m unittest discover -s cli/tests -v
          if ($LASTEXITCODE -ne 0) { throw "CLI wrapper tests failed" }
