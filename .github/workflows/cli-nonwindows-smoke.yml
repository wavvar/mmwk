name: CLI Shell Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cli/**"
      - ".github/workflows/cli-nonwindows-smoke.yml"
  push:
    branches:
      - "main"
      - "dev"
    paths:
      - "cli/**"
      - ".github/workflows/cli-nonwindows-smoke.yml"

permissions:
  contents: read

jobs:
  shell-smoke:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # macOS ships Bash 3.2. Exercise the same shell users get by default.
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python deps
        run: |
          python -m venv cli/venv
          cli/venv/bin/python -m pip install --upgrade pip
          cli/venv/bin/python -m pip install -r cli/requirements.txt
          touch cli/venv/.deps_installed

      - name: Compile Python
        run: |
          cli/venv/bin/python -m compileall -q cli/mmwk cli/tests

      - name: Check shell wrappers
        run: |
          /bin/bash --version
          for script in cli/*.sh cli/.*.sh; do
            /bin/bash -n "$script"
          done

      - name: Test CLI wrappers and local services
        run: |
          cli/venv/bin/python -m unittest discover -s cli/tests -v
